events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    
    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    server {
        listen 80;
        server_name localhost;
        root /usr/share/nginx/html;
        index index.html;

        # Proxy API requests to the backend
        # Voyage log photos: the only place larger uploads are allowed. The log
        # shrinks photos on the device first; this leaves headroom.
        location ^~ /api/voyage/photos/ {
            client_max_body_size 10m;
            proxy_pass http://portfolio-backend:8000/api/voyage/photos/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Voyage log videos go up in 2 MB parts (VIDEO_PART_BYTES in the back end).
        # Without this the default limit of 1 MB turns every part away, and the
        # log page reads the dropped connection as "No connection".
        location ^~ /api/voyage/videos/ {
            client_max_body_size 3m;
            proxy_pass http://portfolio-backend:8000/api/voyage/videos/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # The ship's log service worker has to be re-checked on every visit,
        # not cached for a year like other scripts.
        location = /voyage-sw.js {
            add_header Cache-Control "no-cache";
        }

        location /api/ {
            proxy_pass http://portfolio-backend:8000/api/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Enable SPA routing
        location / {
            try_files $uri $uri/ /index.html;
        }

        # Cache static assets
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # Security headers
        add_header X-Frame-Options DENY;
        add_header X-Content-Type-Options nosniff;
        add_header X-XSS-Protection "1; mode=block";
    }
}